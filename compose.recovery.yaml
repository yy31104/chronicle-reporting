# Isolated application cutover against a restored database on the existing cluster.
# It never starts, resets, or replaces the primary database service.
services:
  app:
    image: chronicle-local:latest
    user: "${CHRONICLE_APP_UID:?Set the local UID}:${CHRONICLE_APP_GID:?Set the local GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    tmpfs: ["/tmp:size=32m,mode=1777"]
    ports: ["127.0.0.1:${CHRONICLE_RECOVERY_PORT:-8788}:8787"]
    environment:
      CHRONICLE_DB_HOST: postgres
      CHRONICLE_DB_PORT: "5432"
      CHRONICLE_DB_NAME: ${CHRONICLE_RECOVERY_DATABASE:?Run chronicle restore first}
      CHRONICLE_DB_READER_PASSWORD: ${CHRONICLE_DB_READER_PASSWORD:?Local runtime credential required}
      CHRONICLE_ACCESS_FILE: /run/chronicle/access.json
      CHRONICLE_OBJECT_ROOT: /data/objects
    volumes:
      - ${CHRONICLE_RECOVERY_ROOT:?Use a fresh recovery root}/policy:/run/chronicle:ro
      - ${CHRONICLE_RECOVERY_ROOT:?Use a fresh recovery root}/objects:/data/objects:ro
    networks: [primary]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  primary:
    external: true
    name: chronicle_default
