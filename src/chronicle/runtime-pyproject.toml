[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chronicle"
version = "0.1.0"
description = "Revision-aware data and reproducible analysis laboratory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]==3.3.3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
chronicle = "chronicle.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml", "/uv.lock", "/Makefile", "/.python-version", "/compose.yaml", "/compose.private.yaml", "/compose.recovery.yaml", "/scripts", "/data", "/reports", "/docs", "/LICENSE"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
markers = ["postgres: requires a real isolated PostgreSQL server and runtime roles"]
